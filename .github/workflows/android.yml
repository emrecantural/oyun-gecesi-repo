name: android
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Flutter sürümü
        run: flutter --version
      - name: Android platformunu üret ve yamala
        run: |
          flutter create --org com.t14labs --project-name oyungecesi --platforms android --no-pub .
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Analiz
        run: flutter analyze
      - name: Testler
        run: flutter test
      - name: Debug APK
        run: flutter build apk --debug
      - name: Release AAB (hata ayıklama imzalı; yükleme anahtarı henüz yok)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: oyun-gecesi-android
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
